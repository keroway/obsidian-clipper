# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  # pull_request の paths は actionlint・zizmor・shellcheck 向けに絞ってあるため、
  # 同じジョブに同居する typos がリポジトリ全体（docs/ や src/）を検査する機会が
  # PR に無い。週次で全ジョブを走らせてそこを埋める（keroway/.github#16）。
  # cron の分はリポジトリごとにずらして同時発火を避けている。
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # SHA は keroway/.github の main（2026-09-07 時点でレビュー済み）に固定。更新手順は
    # docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@2c7eddb9c4039a291aa3237b675d5a0fc001b85e
